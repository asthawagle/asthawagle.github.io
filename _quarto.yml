project:
  type: website
  output-dir: _site

website:
  title: "Astha Wagle"
  description: "Academic website of Astha Wagle, Environment and Climate Economist."
  site-url: "https://asthawagle.github.io"

  navbar:
    pinned: true
    background: "#ffffff"
    foreground: "#222222"

    left:
      - text: "About"
        href: about.qmd
      - text: "Research"
        href: research.qmd
      - text: "Publications"
        href: publications.qmd
      - text: "Teaching"
        href: teaching.qmd
      - text: "CV"
        href: cv.qmd

    right:
      - icon: envelope
        href: mailto:astha.wagle@ouce.ox.ac.uk
        aria-label: "Email"

      - icon: github
        href: https://github.com/asthawagle
        aria-label: "GitHub"

  page-footer:
    left: "© 2026 Astha Wagle"
    right:
      - text: "Built with Quarto"
        href: https://quarto.org/

format:
  html:
    theme: cosmo
    css: css/styles.css
    toc: false
    smooth-scroll: true
    link-external-newwindow: true
    title-block-banner: false

editor: source